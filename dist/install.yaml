          status:
            description: ReleaseManifestStatus tracks per-component installation state
            properties:
              components:
                additionalProperties:
                  properties:
                    installedVersion:
                      description: Currently installed version
                      type: string
                    lastTransitionTime:
                      description: Last time the state transitioned
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message
                      type: string
                    state:
                      description: Current state of the component
                      type: string
                  type: object
                description: Per-component installation status
                type: object
              conditions:
                description: Standard conditions
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
