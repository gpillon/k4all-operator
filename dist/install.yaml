                            - strategic
                            - json
                            type: string
                        required:
                        - patch
                        - target
                        - type
                        type: object
                      type: array
                    repo:
                      description: Helm repository URL (for type helm) or OCI reference
                        (for type helm-oci)
                      type: string
                    source:
                      description: Single manifest URL (supports {{ version }} and
                        {{ arch }} templates)
                      type: string
                    sources:
                      description: Multiple manifest URLs, applied in order
                      items:
                        type: string
                      type: array
                    type:
                      description: Type of component installation strategy
                      enum:
