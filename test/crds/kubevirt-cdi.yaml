# The KubeVirt and CDI CRDs cut down to what the operator's apply touches,
# for envtest and the kind E2E (the real ones, with the operators that serve
# them, are 900 KB and need /dev/kvm). Each keeps upstream's schema for the
# feature gate list: an atomic list of strings, which a server-side apply
# replaces whole (kubevirt-operator.yaml v1.9.1 marks it atomic,
# cdi-operator.yaml v1.66.1 sets no list type, the same thing). KubeVirt also
# keeps, as in v1.9.1, disabledFeatureGates (new in v1.8, atomic),
# vmStateStorageClass, and workloadUpdateStrategy with its atomic
# workloadUpdateMethods. Every other field is kept as it comes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubevirts.kubevirt.io
spec:
  group: kubevirt.io
  names:
    kind: KubeVirt
    listKind: KubeVirtList
    plural: kubevirts
    singular: kubevirt
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                configuration:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    developerConfiguration:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        featureGates:
                          type: array
                          x-kubernetes-list-type: atomic
                          items:
                            type: string
                        disabledFeatureGates:
                          type: array
                          x-kubernetes-list-type: atomic
                          items:
                            type: string
                    vmStateStorageClass:
                      type: string
                workloadUpdateStrategy:
                  type: object
                  properties:
                    batchEvictionInterval:
                      type: string
                    batchEvictionSize:
                      type: integer
                    workloadUpdateMethods:
                      type: array
                      x-kubernetes-list-type: atomic
                      items:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cdis.cdi.kubevirt.io
spec:
  group: cdi.kubevirt.io
  names:
    kind: CDI
    listKind: CDIList
    plural: cdis
    singular: cdi
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                config:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    featureGates:
                      type: array
                      items:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
