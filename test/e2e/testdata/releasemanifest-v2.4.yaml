# Component set of k4all v2.4.0 (fcos-k8s bootc/overlay/usr/local/share/k4all-release.yaml),
# limited to the components the e2e suite installs. On Kubernetes 1.35 the
# suite installs releasemanifest.yaml (the v2.2.x set), then applies this file
# as the v2.4.0 ReleaseManifest sync does, then releasemanifest-v2.6.yaml; with
# clusterconfig-v2.4-nginx-dedicated-ip.yaml it installs this file directly.
apiVersion: k4all.magesgate.com/v1alpha1
kind: ReleaseManifest
metadata:
  name: k4all
spec:
  osImage:
    name: k4all-bootc
    repository: ghcr.io/gpillon/k4all-bootc
    imageTag: latest
  components:
    # CNI — manifest type with inline manifests, tests manifest install + inline
    calico:
      type: manifest
      version: "v3.33.1"
      sources:
        - "https://raw.githubusercontent.com/projectcalico/calico/{{ version }}/manifests/v1_crd_projectcalico_org.yaml"
        - "https://raw.githubusercontent.com/projectcalico/calico/{{ version }}/manifests/tigera-operator.yaml"
      upgradePath:
        - version: "v3.32.4"
      namespace: tigera-operator
      inlineManifests:
        - |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
              - blockSize: 26
                cidr: 10.244.0.0/16
                encapsulation: VXLANCrossSubnet
                natOutgoing: Enabled
                nodeSelector: all()
        - |
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}

    # Certificates — helm type, tests helm installation
    cert-manager:
      type: helm
      version: "v1.21.3"
      repo: "https://charts.jetstack.io"
      chart: cert-manager
      namespace: cert-manager
      helmArgs:
        - "--set crds.enabled=true"
      upgradePath:
        - version: "v1.15.5"
        - version: "v1.16.5"
        - version: "v1.17.4"
        - version: "v1.18.6"
        - version: "v1.19.6"
        - version: "v1.20.5"
      dependsOn:
        - calico

    # Monitoring — manifest type with patches, tests patching
    metrics-server:
      type: manifest
      # Keep in sync with bootc/overlay/usr/local/share/k4all-release.yaml in fcos-k8s.
      version: "v0.9.1"
      source: "https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ version }}/components.yaml"
      namespace: kube-system
      dependsOn:
        - calico
      patches:
        - target:
            apiVersion: apps/v1
            kind: Deployment
            name: metrics-server
            namespace: kube-system
          type: strategic
          patch: '{"spec":{"template":{"spec":{"containers":[{"name":"metrics-server","args":["--cert-dir=/tmp","--secure-port=10250","--kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname","--kubelet-use-node-status-port","--metric-resolution=15s","--kubelet-insecure-tls"]}]}}}}'

    # MetalLB announces ingress.nginx.dedicatedIP; without one it is not installed.
    metallb:
      type: manifest
      version: "v0.16.2"
      source: "https://raw.githubusercontent.com/metallb/metallb/{{ version }}/config/manifests/metallb-native.yaml"
      namespace: metallb-system
      dependsOn:
        - calico

    # Ingress — the k4all route shapes are served through it before v2.6.0.
    ingress-nginx:
      type: helm
      version: "4.15.1"
      repo: "https://kubernetes.github.io/ingress-nginx"
      chart: ingress-nginx
      namespace: ingress-nginx
      values:
        controller:
          extraArgs:
            enable-ssl-passthrough: ""
          allowSnippetAnnotations: true
          ingressClassResource:
            enabled: true
          kind: DaemonSet
          nodeSelector:
            kubernetes.io/os: linux
            node-role.kubernetes.io/control-plane: ""
      dependsOn:
        - cert-manager
        - metallb

    # Dashboard — the operator's headlamp hook publishes it on
    # dashboard.<ip>.nip.io through the ingress controller. Without the k4all
    # plugin initContainer of the real manifest.
    headlamp:
      type: helm
      version: "0.46.0"
      repo: "https://kubernetes-sigs.github.io/headlamp/"
      chart: headlamp
      namespace: headlamp
      values:
        service:
          type: ClusterIP
          port: 4466
        ingress:
          enabled: false
      dependsOn:
        - cert-manager
