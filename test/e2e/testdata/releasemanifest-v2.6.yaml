# Component set of k4all v2.6.0 (fcos-k8s bootc/overlay/usr/local/share/k4all-release.yaml),
# limited to the components the e2e suite installs: the v2.4.0 set with
# ingress-nginx replaced by Traefik. On Kubernetes 1.35 the suite applies it
# after releasemanifest-v2.4.yaml; on 1.36 and 1.37, which a k4all cluster only
# reaches from v2.6.0, it installs this file directly.
apiVersion: k4all.magesgate.com/v1alpha1
kind: ReleaseManifest
metadata:
  name: k4all
spec:
  osImage:
    name: k4all-bootc
    repository: ghcr.io/gpillon/k4all-bootc
    imageTag: latest
  components:
    # CNI — manifest type with inline manifests, tests manifest install + inline
    calico:
      type: manifest
      version: "v3.33.1"
      sources:
        - "https://raw.githubusercontent.com/projectcalico/calico/{{ version }}/manifests/v1_crd_projectcalico_org.yaml"
        - "https://raw.githubusercontent.com/projectcalico/calico/{{ version }}/manifests/tigera-operator.yaml"
      upgradePath:
        - version: "v3.32.4"
      namespace: tigera-operator
      inlineManifests:
        - |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
              - blockSize: 26
                cidr: 10.244.0.0/16
                encapsulation: VXLANCrossSubnet
                natOutgoing: Enabled
                nodeSelector: all()
        - |
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}

    # Certificates — helm type, tests helm installation
    cert-manager:
      type: helm
      version: "v1.21.3"
      repo: "https://charts.jetstack.io"
      chart: cert-manager
      namespace: cert-manager
      helmArgs:
        - "--set crds.enabled=true"
      upgradePath:
        - version: "v1.15.5"
        - version: "v1.16.5"
        - version: "v1.17.4"
        - version: "v1.18.6"
        - version: "v1.19.6"
        - version: "v1.20.5"
      dependsOn:
        - calico

    # Monitoring — manifest type with patches, tests patching
    metrics-server:
      type: manifest
      # Keep in sync with bootc/overlay/usr/local/share/k4all-release.yaml in fcos-k8s.
      version: "v0.9.1"
      source: "https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ version }}/components.yaml"
      namespace: kube-system
      dependsOn:
        - calico
      patches:
        - target:
            apiVersion: apps/v1
            kind: Deployment
            name: metrics-server
            namespace: kube-system
          type: strategic
          patch: '{"spec":{"template":{"spec":{"containers":[{"name":"metrics-server","args":["--cert-dir=/tmp","--secure-port=10250","--kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname","--kubelet-use-node-status-port","--metric-resolution=15s","--kubelet-insecure-tls"]}]}}}}'

    # LoadBalancer IPs — announces the ingress dedicatedIP. As in the fcos-k8s
    # v2.6.0 manifest; the operator's MetalLB hook adds the address pool.
    metallb:
      type: manifest
      version: "v0.16.2"
      source: "https://raw.githubusercontent.com/metallb/metallb/{{ version }}/config/manifests/metallb-native.yaml"
      namespace: metallb-system
      dependsOn:
        - calico

    # Ingress — Traefik serves the Ingresses written for ingress-nginx through
    # its kubernetesIngressNGINX provider. Uninstalling ingress-nginx deletes
    # the "nginx" IngressClass that provider follows, so Traefik's release
    # recreates it; the operator removes ingress-nginx before installing traefik.
    ingress-nginx:
      type: helm
      management: Removed
      version: "4.15.1"
      repo: "https://kubernetes.github.io/ingress-nginx"
      chart: ingress-nginx
      namespace: ingress-nginx

    traefik:
      type: helm
      # Values as in the fcos-k8s v2.6.0 manifest; the operator's Traefik hook
      # adds the service, the host ports and the default class.
      version: "42.4.0"
      repo: "https://traefik.github.io/charts"
      chart: traefik
      namespace: traefik
      values:
        deployment:
          kind: DaemonSet
        nodeSelector:
          kubernetes.io/os: linux
          node-role.kubernetes.io/control-plane: ""
        providers:
          kubernetesIngressNGINX:
            enabled: true
          kubernetesIngress:
            enabled: true
          kubernetesCRD:
            enabled: true
        ingressClass:
          enabled: true
          name: traefik
        extraObjects:
          - apiVersion: networking.k8s.io/v1
            kind: IngressClass
            metadata:
              name: nginx
            spec:
              controller: k8s.io/ingress-nginx
          # The redirect the operator's headlamp hook puts on the dashboard.
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: redirect-https
              namespace: traefik
            spec:
              redirectScheme:
                scheme: https
                permanent: true
      dependsOn:
        - cert-manager
        - metallb

    # Dashboard — on Traefik from v2.6.0, which it now depends on.
    headlamp:
      type: helm
      version: "0.46.0"
      repo: "https://kubernetes-sigs.github.io/headlamp/"
      chart: headlamp
      namespace: headlamp
      values:
        service:
          type: ClusterIP
          port: 4466
        ingress:
          enabled: false
      dependsOn:
        - cert-manager
        - traefik
