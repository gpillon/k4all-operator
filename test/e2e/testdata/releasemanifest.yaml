# Component set of k4all v2.2.x (fcos-k8s bootc/overlay/usr/local/share/k4all-release.yaml
# at v2.2.4, 27c9dcb), limited to the components the e2e suite installs: the
# set clusters run before the operator syncs v2.4.0. Calico, cert-manager and
# metrics-server as the e2e suite needs them on kind (pod network, pinned
# metrics-server); metallb, ingress-nginx and headlamp as released.
apiVersion: k4all.magesgate.com/v1alpha1
kind: ReleaseManifest
metadata:
  name: k4all
spec:
  osImage:
    name: k4all-bootc
    repository: ghcr.io/gpillon/k4all-bootc
    imageTag: latest
  components:
    calico:
      type: manifest
      version: "v3.27.3"
      source: "https://raw.githubusercontent.com/projectcalico/calico/{{ version }}/manifests/tigera-operator.yaml"
      namespace: tigera-operator
      inlineManifests:
        - |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
              - blockSize: 26
                cidr: 10.244.0.0/16
                encapsulation: VXLANCrossSubnet
                natOutgoing: Enabled
                nodeSelector: all()
        - |
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}

    cert-manager:
      type: helm
      version: "v1.14.5"
      repo: "https://charts.jetstack.io"
      chart: cert-manager
      namespace: cert-manager
      helmArgs:
        - "--set installCRDs=true"
      dependsOn:
        - calico

    metrics-server:
      type: manifest
      # Keep in sync with bootc/overlay/usr/local/share/k4all-release.yaml in fcos-k8s.
      version: "v0.9.1"
      source: "https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ version }}/components.yaml"
      namespace: kube-system
      dependsOn:
        - calico
      patches:
        - target:
            apiVersion: apps/v1
            kind: Deployment
            name: metrics-server
            namespace: kube-system
          type: strategic
          patch: '{"spec":{"template":{"spec":{"containers":[{"name":"metrics-server","args":["--cert-dir=/tmp","--secure-port=10250","--kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname","--kubelet-use-node-status-port","--metric-resolution=15s","--kubelet-insecure-tls"]}]}}}}'

    metallb:
      type: manifest
      version: "v0.15.3"
      source: "https://raw.githubusercontent.com/metallb/metallb/{{ version }}/config/manifests/metallb-native.yaml"
      namespace: metallb-system
      dependsOn:
        - calico
      custom: {}

    ingress-nginx:
      type: helm
      version: "4.14.3"
      repo: "https://kubernetes.github.io/ingress-nginx"
      chart: ingress-nginx
      namespace: ingress-nginx
      values:
        controller:
          extraArgs:
            enable-ssl-passthrough: ""
          allowSnippetAnnotations: true
          ingressClassResource:
            enabled: true
          kind: DaemonSet
          nodeSelector:
            kubernetes.io/os: linux
            node-role.kubernetes.io/control-plane: ""
      dependsOn:
        - cert-manager
        - metallb
      custom: {}

    headlamp:
      type: helm
      version: "0.40.0"
      repo: "https://kubernetes-sigs.github.io/headlamp/"
      chart: headlamp
      namespace: headlamp
      values:
        config:
          oidc:
            clientID: ""
            clientSecret: ""
            issuerURL: ""
            scopes: ""
          pluginsDir: /headlamp/plugins
        service:
          type: NodePort
          port: 4466
          nodePort: 32323
        ingress:
          enabled: false
      dependsOn:
        - cert-manager
      custom: {}
