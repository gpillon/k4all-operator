# An upgrade graph served inside the cluster: from v2.5.0 the path to v2.6.1
# is two hops, since v2.6.1 is a patch of the v2.6 stream (minFrom v2.6.0).
apiVersion: v1
kind: Namespace
metadata:
  name: k4all-e2e-upgrade
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: graph
  namespace: k4all-e2e-upgrade
data:
  upgrade-graph.json: |
    {"schema": 1, "image": "ghcr.io/gpillon/k4all-bootc", "releases": [
      {"version": "v2.5.0", "kind": "minor", "minFrom": "v2.4.0", "kubernetes": "1.35.10", "crio": "1.35", "fedora": 45},
      {"version": "v2.6.0", "kind": "minor", "minFrom": "v2.5.0", "kubernetes": "1.35.10", "crio": "1.35", "fedora": 45,
       "syncManifest": true, "notes": "Traefik replaces ingress-nginx."},
      {"version": "v2.6.1", "kind": "patch", "minFrom": "v2.6.0", "kubernetes": "1.35.11", "crio": "1.35", "fedora": 45}
    ]}
---
# A Deployment, so the drain moves it instead of deleting it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph
  namespace: k4all-e2e-upgrade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graph
  template:
    metadata:
      labels:
        app: graph
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: httpd
          image: busybox:1.37
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: graph
              mountPath: /www
      volumes:
        - name: graph
          configMap:
            name: graph
---
apiVersion: v1
kind: Service
metadata:
  name: graph
  namespace: k4all-e2e-upgrade
spec:
  selector:
    app: graph
  ports:
    - port: 80
      targetPort: 8080
