# This rule is not used by the project k4all-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to k4all.magesgate.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k4all-operator
    app.kubernetes.io/managed-by: kustomize
  name: releasemanifest-viewer-role
rules:
- apiGroups:
  - k4all.magesgate.com
  resources:
  - releasemanifests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - k4all.magesgate.com
  resources:
  - releasemanifests/status
  verbs:
  - get
