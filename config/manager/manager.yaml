apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: k4all-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: k4all-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  # Deliberately not the scaffold's selector (which also has app.kubernetes.io/name):
  # spec.selector is immutable and the operator updates itself by server-side
  # applying a newer install.yaml, so changing it would fail on every existing
  # cluster. The pod template carries the label, so Services and NetworkPolicies
  # can still select on it.
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: k4all-operator
    spec:
      # Deliberately not the scaffold's commented-out architecture affinity.
      # The operator tolerates the cordon (below); with more nodes, a
      # cordoned node would be as good a fit as any, so the drain that evicts
      # this pod could put it back on the node about to reboot (k4all#86).
      # Whoever drains a node for a hop labels it draining=true with the
      # cordon: the ClusterUpgrade, k4all-upgrade, or the admin by hand
      # (docs/upgrades.md). Only preferred: a single node must still fit.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: k4all.magesgate.com/draining
                    operator: NotIn
                    values:
                      - "true"
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        imagePullPolicy: IfNotPresent
        name: manager
        env:
          # The ClusterUpgrade drain never evicts the operator's own pod.
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      # A ClusterUpgrade cordons the node of each hop. When that node runs the
      # operator and its pod has to be recreated (a reboot longer than the
      # not-ready eviction), it must still fit there to uncordon the node.
      tolerations:
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
