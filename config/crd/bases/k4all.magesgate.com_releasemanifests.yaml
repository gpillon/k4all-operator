---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: releasemanifests.k4all.magesgate.com
spec:
  group: k4all.magesgate.com
  names:
    kind: ReleaseManifest
    listKind: ReleaseManifestList
    plural: releasemanifests
    singular: releasemanifest
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Components
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ReleaseManifest is the Schema for the releasemanifests API.
          It defines all components and their versions for a k4all cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReleaseManifestSpec mirrors the k4all-release.yaml structure
            properties:
              components:
                additionalProperties:
                  properties:
                    chart:
                      description: Helm chart name
                      type: string
                    custom:
                      additionalProperties:
                        type: string
                      description: User-customizable key-value pairs preserved across
                        upgrades
                      type: object
                    dependsOn:
                      description: Components that must be installed before this one
                      items:
                        type: string
                      type: array
                    featureGate:
                      description: If set, this component is only installed when the
                        named feature is enabled in ClusterConfig
                      type: string
                    helmArgs:
                      description: Extra Helm CLI-style arguments (e.g. "--set installCRDs=true")
                      items:
                        type: string
                      type: array
                    image:
                      description: Container image reference (for static-pod type,
                        supports {{ version }})
                      type: string
                    inlineManifests:
                      description: |-
                        Raw YAML manifests to apply inline (for manifest-type components).
                        Applied after URL-sourced manifests, with retry for CRD availability.
                      items:
                        type: string
                      type: array
                    installPath:
                      description: Host filesystem path for binary installation
                      type: string
                    management:
                      default: Managed
                      description: 'Lifecycle management policy: Managed (default),
                        Removed, or Unmanaged'
                      enum:
                      - Managed
                      - Removed
                      - Unmanaged
                      type: string
                    namespace:
                      description: Target namespace for the component
                      type: string
                    patches:
                      description: Post-install patches to apply to cluster resources
                      items:
                        properties:
                          patch:
                            description: Raw patch content (JSON or YAML)
                            type: string
                          target:
                            description: Target resource to patch
                            properties:
                              apiVersion:
                                description: API version of the target resource
                                type: string
                              kind:
                                description: Kind of the target resource
                                type: string
                              name:
                                description: Name of the target resource
                                type: string
                              namespace:
                                description: Namespace of the target resource; empty
                                  for cluster-scoped
                                type: string
                            required:
                            - kind
                            - name
                            type: object
                          type:
                            description: Patch strategy
                            enum:
                            - merge
                            - strategic
                            - json
                            type: string
                        required:
                        - patch
                        - target
                        - type
                        type: object
                      type: array
                    repo:
                      description: Helm repository URL (for type helm) or OCI reference
                        (for type helm-oci)
                      type: string
                    source:
                      description: Single manifest URL (supports {{ version }} and
                        {{ arch }} templates)
                      type: string
                    sources:
                      description: Multiple manifest URLs, applied in order
                      items:
                        type: string
                      type: array
                    type:
                      description: Type of component installation strategy
                      enum:
                      - helm
                      - helm-oci
                      - manifest
                      - binary
                      - static-pod
                      type: string
                    values:
                      description: Inline Helm values (arbitrary YAML)
                      x-kubernetes-preserve-unknown-fields: true
                    valuesFrom:
                      description: References to ConfigMaps containing Helm values
                      items:
                        properties:
                          kind:
                            description: Kind of the reference (ConfigMap or Secret)
                            enum:
                            - ConfigMap
                            - Secret
                            type: string
                          name:
                            description: Name of the ConfigMap or Secret
                            type: string
                          namespace:
                            description: Namespace of the ConfigMap or Secret; defaults
                              to the release namespace
                            type: string
                          valuesKey:
                            description: Key in the ConfigMap/Secret data; defaults
                              to "values.yaml"
                            type: string
                        required:
                        - kind
                        - name
                        type: object
                      type: array
                    version:
                      description: Desired version; "latest" triggers resolution via
                        VersionURL
                      type: string
                    versionUrl:
                      description: URL to fetch the latest version string (for "latest"
                        resolution)
                      type: string
                  required:
                  - type
                  - version
                  type: object
                description: Components to install, keyed by component name
                type: object
              osImage:
                description: OS image specification
                properties:
                  imageTag:
                    type: string
                  name:
                    type: string
                  repository:
                    type: string
                type: object
            required:
            - components
            type: object
          status:
            description: ReleaseManifestStatus tracks per-component installation state
            properties:
              components:
                additionalProperties:
                  properties:
                    installedVersion:
                      description: Currently installed version
                      type: string
                    lastTransitionTime:
                      description: Last time the state transitioned
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message
                      type: string
                    state:
                      description: Current state of the component
                      type: string
                  type: object
                description: Per-component installation status
                type: object
              conditions:
                description: Standard conditions
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              resolvedOSImageTag:
                description: Resolved OS image tag (stamped by CI)
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
