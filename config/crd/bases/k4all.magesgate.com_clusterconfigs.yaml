---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: clusterconfigs.k4all.magesgate.com
spec:
  group: k4all.magesgate.com
  names:
    kind: ClusterConfig
    listKind: ClusterConfigList
    plural: clusterconfigs
    singular: clusterconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.networking.cni.type
      name: CNI
      type: string
    - jsonPath: .spec.features.virt.enabled
      name: Virt
      type: boolean
    - jsonPath: .spec.features.argocd.enabled
      name: ArgoCD
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterConfig is the Schema for the clusterconfigs API.
          It defines user intent for which components and features to enable.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterConfigSpec defines the desired state of the k4all
              cluster
            properties:
              cluster:
                description: Control plane / HA configuration
                properties:
                  apiEndPointUseHostName:
                    description: Use hostname as API endpoint instead of IP
                    type: boolean
                  customApiEndPoint:
                    description: Custom hostname for the control plane API endpoint
                    type: string
                  ha:
                    description: HA configuration
                    properties:
                      apiControlEndpoint:
                        description: Virtual IP address for the control plane
                        type: string
                      apiControlEndpointSubnetSize:
                        description: Subnet size for the virtual IP (e.g. "24")
                        type: string
                      interface:
                        description: Network interface for the virtual IP
                        type: string
                      type:
                        default: none
                        enum:
                        - none
                        - keepalived
                        - kubevip
                        type: string
                    type: object
                  podNetwork:
                    description: 'Pod network CIDR (default: "10.100.0.1/18")'
                    type: string
                  serviceNetwork:
                    description: 'Service network CIDR (default: "10.96.0.0/16")'
                    type: string
                type: object
              componentOverrides:
                additionalProperties:
                  description: ComponentOverride allows per-component value overrides
                    in ClusterConfig
                  properties:
                    helmArgs:
                      description: Extra Helm arguments to append
                      items:
                        type: string
                      type: array
                    values:
                      description: Inline Helm values to merge on top of ReleaseManifest
                        values
                      x-kubernetes-preserve-unknown-fields: true
                  type: object
                description: |-
                  Per-component value overrides (component name -> Helm values or custom config).
                  These override values from ReleaseManifest for the named component.
                type: object
              features:
                description: Features to enable
                properties:
                  argocd:
                    description: ArgoCD GitOps feature
                    properties:
                      enabled:
                        type: boolean
                    type: object
                  ovsBridge:
                    description: OVS bridge creation via nmstate NNCP on every node
                    properties:
                      enabled:
                        type: boolean
                    type: object
                  ovsCni:
                    description: OVS networking with Multus + OVS-CNI
                    properties:
                      enabled:
                        type: boolean
                    type: object
                  rook:
                    description: |-
                      Rook/Ceph storage, with the Cairn console. Optional: absent or not
                      enabled, k4all installs no Rook.
                    properties:
                      enabled:
                        description: |-
                          Install Rook and create the Ceph cluster. Turning it off does not remove
                          Rook while a CephCluster exists, and k4all never wipes disks.
                        type: boolean
                      smallCluster:
                        description: |-
                          What to do below 3 nodes: Refuse (nothing is created, the status says
                          why) or Allow (one mon, pool size the node count, no redundancy).
                          Empty means Refuse.
                        enum:
                        - Refuse
                        - Allow
                        type: string
                      storage:
                        description: |-
                          Which disks become OSDs, read once, when k4all creates the CephCluster.
                          Absent: every blank device of every node (a device with a filesystem
                          or an LVM signature, as the OS disk and TopoLVM's, is skipped).
                        properties:
                          deviceFilter:
                            description: |-
                              Regular expression on device names ("^sdb$", "^nvme[01]n1$"), as
                              Rook's storage.deviceFilter. Absent: every blank device.
                            type: string
                        type: object
                    type: object
                  virt:
                    description: Virtualization feature (KubeVirt + CDI + the Hangar
                      console)
                    properties:
                      emulation:
                        default: auto
                        description: |-
                          Emulation mode, set in the KubeVirt CR as useEmulation (the operator puts
                          back a value changed there by hand): "true", "false", or "auto". With
                          "auto" the nodes decide, from the devices.kubevirt.io/kvm that
                          virt-handler offers where /dev/kvm exists: emulation is off once a node
                          offers KVM, on once virt-handler runs and none does.
                        enum:
                        - "true"
                        - "false"
                        - auto
                        type: string
                      enabled:
                        type: boolean
                      hangar:
                        description: |-
                          Settings of the Hangar console, which k4all installs with virt.
                          Absent: the release's defaults.
                        properties:
                          nodeAgent:
                            description: |-
                              Install Hangar's privileged node agent (host inventory, device
                              passthrough), needed by Hangar's Hardware tab and PCI passthrough.
                              Absent: the release's default, which installs it with virt.
                            type: boolean
                        type: object
                      kubevirt:
                        description: |-
                          KubeVirt settings k4all owns in the KubeVirt CR. Absent: k4all owns none
                          of them; Hangar or the admin set them in the KubeVirt CR.
                        properties:
                          disabledFeatureGates:
                            description: |-
                              Feature gates k4all turns off: removed from featureGates and, on
                              KubeVirt 1.8 and later, written to disabledFeatureGates. A gate cannot
                              be in both lists. KubeVirt ignores a GA gate here; the operator reports
                              it in the KubeVirtSettings condition where KubeVirt does.
                            items:
                              type: string
                            maxItems: 64
                            type: array
                            x-kubernetes-list-type: set
                          featureGates:
                            description: |-
                              Feature gates k4all turns on. They are added to the gates already in the
                              KubeVirt CR (set by Hangar or the admin), which stay; a gate removed
                              from this list is removed from the CR only if k4all had added it.
                              HotplugVolumes turns DeclarativeHotplugVolumes off: list one of them.
                            items:
                              type: string
                            maxItems: 64
                            type: array
                            x-kubernetes-list-type: set
                          vmStateStorageClass:
                            description: |-
                              StorageClass of the persistent VM state (EFI variables, TPM), as the
                              KubeVirt CR's vmStateStorageClass. Absent: not owned; the value set in
                              the KubeVirt CR applies, and without one the default StorageClass. A
                              StorageClass that does not exist is still written, and reported in the
                              KubeVirtSettings condition.
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: a gate cannot be both on and off
                          rule: '!has(self.featureGates) || !has(self.disabledFeatureGates)
                            || !self.featureGates.exists(g, g in self.disabledFeatureGates)'
                        - message: 'HotplugVolumes turns DeclarativeHotplugVolumes
                            off: set one'
                          rule: '!has(self.featureGates) || !(''HotplugVolumes'' in
                            self.featureGates && ''DeclarativeHotplugVolumes'' in
                            self.featureGates)'
                      metadata:
                        description: |-
                          The metadata service VMs reach on 169.254.169.254 (OpenStack and EC2
                          formats, workload-identity tokens). Absent: off, as enabled false.
                        properties:
                          enabled:
                            description: 'Serve metadata to the VMs of the scope.
                              false or absent: off.'
                            type: boolean
                          scope:
                            description: |-
                              Which VMs get the service: Labelled (the VM template has the label
                              k4all.magesgate.com/metadata: enabled) or All (every VM in the
                              namespaces whose PodSecurity level allows it). Empty means Labelled.
                            enum:
                            - Labelled
                            - All
                            type: string
                          tokens:
                            description: |-
                              The workload-identity tokens (service account tokens) served to the
                              guest. Absent: the operator's defaults.
                            properties:
                              audiences:
                                description: |-
                                  Audiences of the tokens. Never the API server's own audience: a token
                                  taken from a guest must not be able to call the API server. Absent: the
                                  operator's default.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: set
                              expirationSeconds:
                                description: |-
                                  Lifetime of a token, in seconds; at least 600, kubelet's minimum for a
                                  projected token. Absent: the operator's default.
                                format: int64
                                minimum: 600
                                type: integer
                            type: object
                          vendorDataConfigMap:
                            description: |-
                              Name of a ConfigMap in each VM's namespace with the cloud-init
                              vendor-data served to its VMs; a namespace without it serves none.
                              Absent: no vendor-data.
                            type: string
                        type: object
                    type: object
                type: object
              ingress:
                description: Ingress controller configuration
                properties:
                  cilium:
                    description: CiliumIngressConfig configures the Cilium ingress.
                    properties:
                      dedicatedIP:
                        description: Dedicated LoadBalancer IP for Cilium ingress
                        type: string
                    type: object
                  nginx:
                    description: |-
                      Deprecated since k4all v2.6.0: use ingress.traefik. From v2.6.0 the
                      operator moves these settings to ingress.traefik and removes this key.
                    properties:
                      dedicatedIP:
                        description: Dedicated LoadBalancer IP; leave empty to use
                          the node IP directly
                        type: string
                      isDefault:
                        default: true
                        description: Whether NGINX should be the default IngressClass.
                          Left out, it is.
                        type: boolean
                    type: object
                  traefik:
                    description: |-
                      Traefik replaces NGINX from k4all v2.6.0. When absent, Traefik takes the
                      nginx settings, so clusters installed earlier keep their IP and default.
                    properties:
                      dedicatedIP:
                        description: Dedicated LoadBalancer IP; leave empty to use
                          the node IP directly
                        type: string
                      isDefault:
                        default: true
                        description: Whether Traefik should be the default IngressClass.
                          Left out, it is.
                        type: boolean
                    type: object
                type: object
              networking:
                description: Networking configuration
                properties:
                  cni:
                    description: CNI plugin selection
                    properties:
                      cilium:
                        description: |-
                          Cilium options, used when type is cilium. The operator translates them
                          into Cilium Helm values; componentOverrides.cilium can still override any value.
                        properties:
                          additionalDevices:
                            description: |-
                              Interfaces Cilium attaches to, in addition to ovs-bridge when the OVS
                              bridge feature is enabled.
                            items:
                              type: string
                            type: array
                          gatewayAPI:
                            description: Enable Cilium's Gateway API implementation.
                            type: boolean
                          hubble:
                            description: Deploy Hubble Relay and the Hubble UI.
                            type: boolean
                          l2announcements:
                            description: Announce LoadBalancer IPs on the local network
                              (L2 announcements).
                            type: boolean
                        type: object
                      type:
                        enum:
                        - calico
                        - cilium
                        type: string
                    required:
                    - type
                    type: object
                  firewalld:
                    description: Firewalld settings
                    properties:
                      enabled:
                        type: boolean
                    type: object
                required:
                - cni
                type: object
              nodes:
                description: |-
                  Node settings k4all owns, the same on every node: kubelet settings,
                  hugepages, IOMMU. The operator rolls a change out one node at a time.
                  Absent, or a field of it absent: k4all does not own that setting and
                  leaves what kubeadm or the admin set. Clearing a field removes what
                  k4all had written for it, and only that.
                properties:
                  hugepages:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: |-
                      Hugepages to reserve on every node, as kernel arguments: page size
                      ("1Gi" or "2Mi") to the number of pages per node; 0 reserves none. A
                      change reboots the nodes. A size left out is not owned. k4all removes
                      only the kernel arguments it added, never ones set by hand.
                    type: object
                    x-kubernetes-validations:
                    - message: hugepages page sizes are 1Gi and 2Mi
                      rule: self.all(size, size == '1Gi' || size == '2Mi')
                    - message: hugepage counts are 0 or more
                      rule: self.all(size, self[size] >= 0)
                  iommu:
                    description: |-
                      IOMMU in passthrough mode (intel_iommu=on or amd_iommu=on, iommu=pt) as
                      kernel arguments, for PCI passthrough to VMs. A change reboots the nodes.
                      true: k4all adds them. false or absent: k4all adds none and removes the
                      ones it had added; arguments set by hand are never touched.
                    type: boolean
                  kubelet:
                    description: |-
                      Kubelet settings, written to kube-system/kubelet-config (the
                      KubeletConfiguration kubeadm gives every node, joining nodes too).
                      Fields left out keep the value kubeadm or the admin set there.
                    properties:
                      cpuManagerPolicy:
                        description: |-
                          Kubelet CPU manager policy. static gives Guaranteed pods with integer
                          CPU requests exclusive CPUs, and needs reservedSystemCPUs. A change
                          drains each node and resets its CPU manager state.
                        enum:
                        - none
                        - static
                        type: string
                      maxPods:
                        description: |-
                          Maximum number of pods per node. It must fit the pod CIDR of each node
                          (at most 250 with Cilium's /24). Changing only this restarts kubelet,
                          without a drain.
                        format: int32
                        maximum: 1000
                        minimum: 10
                        type: integer
                      reservedSystemCPUs:
                        description: |-
                          CPUs kept for the system and kubelet, as a cpuset ("0-1", "0,2"): no pod
                          gets them exclusively. Required with the static CPU manager. Every node
                          must have them. A change drains each node and resets its CPU manager
                          state.
                        type: string
                      topologyManagerPolicy:
                        description: |-
                          Kubelet topology manager policy: how CPU, memory and device allocations
                          are aligned on NUMA nodes.
                        enum:
                        - none
                        - best-effort
                        - restricted
                        - single-numa-node
                        type: string
                      topologyManagerScope:
                        description: 'Kubelet topology manager scope: align each container,
                          or the whole pod.'
                        enum:
                        - container
                        - pod
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: the static CPU manager needs reservedSystemCPUs
                      rule: '!has(self.cpuManagerPolicy) || self.cpuManagerPolicy
                        != ''static'' || (has(self.reservedSystemCPUs) && size(self.reservedSystemCPUs)
                        > 0)'
                  rollout:
                    description: How the operator rolls a change of these settings
                      out.
                    properties:
                      paused:
                        description: |-
                          Stop the rollout before the next node; the node in progress finishes.
                          false or absent: the rollout goes on, one node at a time.
                        type: boolean
                    type: object
                type: object
              proxy:
                description: |-
                  Proxy configuration for cluster-wide HTTP(S) proxy settings.
                  Pre-boot scripts read these before the cluster starts; the operator
                  also exposes them for in-cluster components that need proxy awareness.
                properties:
                  httpProxy:
                    type: string
                  httpsProxy:
                    type: string
                  noProxy:
                    type: string
                type: object
            required:
            - cluster
            - features
            - networking
            type: object
          status:
            description: ClusterConfigStatus reflects the observed cluster state
            properties:
              activeCNI:
                description: Currently active CNI
                type: string
              conditions:
                description: Standard conditions (Reconciled, Degraded)
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              features:
                description: Per-feature observed state
                properties:
                  argocdReady:
                    type: boolean
                  ovsBridgeReady:
                    type: boolean
                  ovsCniReady:
                    type: boolean
                  virtReady:
                    type: boolean
                type: object
              lastReconcileTime:
                description: Last time the config was reconciled
                format: date-time
                type: string
              nodes:
                description: |-
                  Rollout of spec.nodes, written by the operator. Absent until spec.nodes
                  sets something.
                properties:
                  perNode:
                    description: One entry per node.
                    items:
                      description: NodeSettingsStatus is the node settings state of
                        one node.
                      properties:
                        appliedHash:
                          description: |-
                            Settings hash the node last reported applied (its
                            k4all.magesgate.com/node-settings-applied annotation).
                          type: string
                        message:
                          description: What the node does or waits for, or why it
                            refuses the settings.
                          type: string
                        name:
                          description: Node name.
                          type: string
                        phase:
                          description: Where the node is in its rollout step.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  rollout:
                    description: The rollout across the nodes.
                    properties:
                      currentNode:
                        description: The node being given the settings, while Rolling.
                        type: string
                      message:
                        description: What the rollout does or waits for, in words.
                        type: string
                      phase:
                        description: Idle, Rolling, Paused or Blocked.
                        type: string
                    type: object
                  settingsHash:
                    description: |-
                      Hash of the node settings the nodes must have (spec.nodes and the
                      action they take: restart, drain and restart, drain and reboot).
                    type: string
                type: object
              observedGeneration:
                description: Most recently processed generation of the spec
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
