apiVersion: k4all.magesgate.com/v1alpha1
kind: ClusterConfig
metadata:
  name: k4all-cluster-config
spec:
  networking:
    cni:
      type: calico
      # Used when type is cilium; translated into Cilium Helm values.
      cilium:
        l2announcements: false
        hubble: false
        gatewayAPI: false
        additionalDevices: []
    firewalld:
      enabled: false
  features:
    virt:
      enabled: false
      emulation: auto
    argocd:
      enabled: false
    ovsCni:
      enabled: false
    ovsBridge:
      enabled: false
  cluster:
    apiEndPointUseHostName: false
    podNetwork: "10.100.0.1/18"
    serviceNetwork: "10.96.0.0/16"
    ha:
      type: none
  ingress:
    # Traefik serves the routes from k4all v2.6.0. Without this key it takes
    # the settings of ingress.nginx, as on clusters installed earlier.
    traefik:
      dedicatedIP: ""
      isDefault: true
  proxy:
    httpProxy: ""
    httpsProxy: ""
    noProxy: ""
