name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    # Same-repo PRs are already covered by the push run on the head commit
    # (its checks show up on the PR); only PRs from forks need their own run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      # setup-go's built-in cache uses one key for every job, so lint/test/e2e
      # race to save it; a per-job key keeps each job's build cache relevant.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-

      # controller-gen, setup-envtest and the envtest binaries (bin/k8s);
      # their versions are pinned in the Makefile or derived from go.mod.
      - name: Cache tool binaries
        uses: actions/cache@v6
        with:
          path: bin
          key: bin-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Makefile', 'go.mod') }}

      - name: Running Tests
        run: |
          go mod tidy
          make test
