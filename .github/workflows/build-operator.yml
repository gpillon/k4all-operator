name: Build and Release K4All Operator

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - bootc-*
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. v2.0.0-beta)"
        required: false
        default: ""

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/k4all-operator

jobs:
  # ------------------------------------------------------------------
  # 1. Build per-arch images on native runners (fast, no QEMU)
  # ------------------------------------------------------------------
  build-image:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          IS_TAG="false"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IS_TAG="true"
          fi
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=K4All Operator
            org.opencontainers.image.description=Kubernetes operator for K4All cluster lifecycle
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # ------------------------------------------------------------------
  # 2. Create multi-arch manifest from per-arch images
  # ------------------------------------------------------------------
  push-manifest:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          VERSION="${{ needs.build-image.outputs.version }}"
          docker manifest create "${{ env.IMAGE_NAME }}:${VERSION}" \
            "${{ env.IMAGE_NAME }}:${VERSION}-amd64" \
            "${{ env.IMAGE_NAME }}:${VERSION}-arm64"
          docker manifest push "${{ env.IMAGE_NAME }}:${VERSION}"

          if [ "${{ needs.build-image.outputs.is_tag }}" = "true" ]; then
            docker manifest create "${{ env.IMAGE_NAME }}:latest" \
              "${{ env.IMAGE_NAME }}:${VERSION}-amd64" \
              "${{ env.IMAGE_NAME }}:${VERSION}-arm64"
            docker manifest push "${{ env.IMAGE_NAME }}:latest"
          fi

  # ------------------------------------------------------------------
  # 3. Generate install.yaml and create GitHub Release
  # ------------------------------------------------------------------
  release:
    needs: [build-image, push-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Generate install.yaml
        run: |
          export IMG=${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.version }}
          make manifests generate
          make build-installer
          echo "Generated dist/install.yaml for image ${IMG}"
          ls -lh dist/install.yaml

      - name: Create tagged release
        if: needs.build-image.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-image.outputs.version }}
          name: "K4All Operator ${{ needs.build-image.outputs.version }}"
          prerelease: ${{ needs.build-image.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/install.yaml
          body: |
            ## K4All Operator ${{ needs.build-image.outputs.version }}

            ### Installation
            ```bash
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ needs.build-image.outputs.version }}/install.yaml
            ```

            ### Container Image
            ```
            ghcr.io/${{ github.repository_owner }}/k4all-operator:${{ needs.build-image.outputs.version }}
            ```

      - name: Create/update latest prerelease
        if: needs.build-image.outputs.is_tag != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest dist/install.yaml \
            --title "Latest Build" \
            --prerelease \
            --notes "## K4All Operator (Latest)

          Latest build from \`${{ github.ref_name }}\` branch (commit \`${GITHUB_SHA::8}\`).

          ### Installation
          \`\`\`bash
          kubectl apply -f https://github.com/${{ github.repository }}/releases/download/latest/install.yaml
          \`\`\`

          ### Container Image
          \`\`\`
          ghcr.io/${{ github.repository_owner }}/k4all-operator:latest
          \`\`\`"
