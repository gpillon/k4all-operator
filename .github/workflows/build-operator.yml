name: Build and Release K4All Operator

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - bootc-*
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. v2.0.0-beta)"
        required: false
        default: ""

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/k4all-operator

jobs:
  # ------------------------------------------------------------------
  # 1. Build operator image + generate install.yaml manifest
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          IS_TAG="false"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IS_TAG="true"
          fi
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IS_TAG="${{ steps.version.outputs.is_tag }}"
          TAGS="${{ env.IMAGE_NAME }}:${VERSION}"
          if [ "$IS_TAG" = "true" ]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=K4All Operator
            org.opencontainers.image.description=Kubernetes operator for K4All cluster lifecycle
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate install.yaml manifest
        run: |
          export IMG=${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          make manifests generate
          make build-installer
          echo "Generated dist/install.yaml for image ${IMG}"
          ls -lh dist/install.yaml

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: operator-install-manifest
          path: dist/install.yaml
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. Create GitHub Release with install.yaml asset
  # ------------------------------------------------------------------
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: operator-install-manifest
          path: dist

      - name: Create tagged release
        if: needs.build.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: "K4All Operator ${{ needs.build.outputs.version }}"
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/install.yaml
          body: |
            ## K4All Operator ${{ needs.build.outputs.version }}

            ### Installation
            ```bash
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.version }}/install.yaml
            ```

            ### Container Image
            ```
            ghcr.io/${{ github.repository_owner }}/k4all-operator:${{ needs.build.outputs.version }}
            ```

      - name: Create/update latest prerelease
        if: needs.build.outputs.is_tag != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove existing latest release so assets are replaced cleanly
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest dist/install.yaml \
            --title "Latest Build" \
            --prerelease \
            --notes "## K4All Operator (Latest)

          Latest build from \`${{ github.ref_name }}\` branch (commit \`${GITHUB_SHA::8}\`).

          ### Installation
          \`\`\`bash
          kubectl apply -f https://github.com/${{ github.repository }}/releases/download/latest/install.yaml
          \`\`\`

          ### Container Image
          \`\`\`
          ghcr.io/${{ github.repository_owner }}/k4all-operator:latest
          \`\`\`"
